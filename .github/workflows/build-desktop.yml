name: Build desktop apps
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            artifact: XiaoetongDownloader-macOS.zip
          - os: windows-latest
            artifact: XiaoetongDownloader-Windows.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-build.txt
      - run: python scripts/build_app.py
      - name: Check packaged browser and ffmpeg on macOS
        if: runner.os == 'macOS'
        run: |
          dist/XiaoetongDownloader.app/Contents/MacOS/XiaoetongDownloader --self-test build/self-test.json
          python -c "import json; d=json.load(open('build/self-test.json')); assert d['browser']=='about:blank' and d['ffmpeg']"
      - name: Check packaged browser and ffmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Start-Process -FilePath dist/XiaoetongDownloader/XiaoetongDownloader.exe -ArgumentList '--self-test build/self-test.json' -Wait
          python -c "import json; d=json.load(open('build/self-test.json')); assert d['browser']=='about:blank' and d['ffmpeg']"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
